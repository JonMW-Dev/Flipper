name: macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Flipper and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build Flipper.app
        run: pyinstaller --noconfirm packaging/flipper.spec

      - name: Ad-hoc sign the app
        run: codesign --force --deep --sign - dist/Flipper.app

      - name: Zip the app
        run: ditto -c -k --keepParent dist/Flipper.app Flipper-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Flipper-mac
          path: Flipper-mac.zip
