[project]
name = "flipper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JonMW-Dev", email = "jonwindle@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.51.0",
    "platformdirs>=4.14.5",
    "pyside6>=6.12.0",
]

[project.scripts]
flipper = "flipper.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

# Pylance reads this because pyproject.toml exists.
# python.analysis.typeCheckingMode in VS Code settings is ignored.
[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
